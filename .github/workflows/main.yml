name: Publish Files with Jekyll

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  JSON_CONFIG: "files.json"
  OUTPUT_DIR: "public"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Jekyll Site
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          
          # Titel aus JSON lesen
          PAGE_TITLE=$(jq -r '.titel // "Script Download Portal"' ${{ env.JSON_CONFIG }})
          
          # Markdown Header (Frontmatter) fuer Jekyll erstellen
          cat > ${{ env.OUTPUT_DIR }}/index.md <<EOF
          ---
          layout: default
          title: $PAGE_TITLE
          ---
          # $PAGE_TITLE

          Dies ist die aktuelle Liste der verfügbaren Scripte.
          
          EOF

          # Aktuelle Version Korrektur-Tool (vom Sync-Workflow in files.json gesetzt)
          CHECKER_VERSION=$(jq -r '.korrekturtool.version // empty' ${{ env.JSON_CONFIG }})
          if [ -n "$CHECKER_VERSION" ]; then
            CHECKER_DOCKER=$(jq -r '.korrekturtool.docker // empty' ${{ env.JSON_CONFIG }})
            CHECKER_URL=$(jq -r '.korrekturtool.url // empty' ${{ env.JSON_CONFIG }})
            echo "**Korrektur-Tool: Version $CHECKER_VERSION** – \`docker pull $CHECKER_DOCKER\` ([alle Versionen]($CHECKER_URL))" >> ${{ env.OUTPUT_DIR }}/index.md
            echo "" >> ${{ env.OUTPUT_DIR }}/index.md
          fi

          # Aktuelle Version draw.io-Bibliothek
          BIB_VERSION=$(jq -r '.bibliothek.version // empty' ${{ env.JSON_CONFIG }})
          if [ -n "$BIB_VERSION" ]; then
            BIB_DATEI=$(jq -r '.bibliothek.datei' ${{ env.JSON_CONFIG }})
            BIB_PFAD=$(jq -r '.bibliothek.pfad // empty' ${{ env.JSON_CONFIG }})
            BIB_LINK="$BIB_DATEI"
            if [ -f "$BIB_PFAD" ]; then BIB_LINK="$BIB_DATEI?v=$(sha256sum "$BIB_PFAD" | cut -c1-10)"; fi
            echo "**draw.io-Bibliothek: Version $BIB_VERSION** – [$BIB_DATEI]($BIB_LINK)" >> ${{ env.OUTPUT_DIR }}/index.md
            echo "" >> ${{ env.OUTPUT_DIR }}/index.md
          fi

          # Projekte aus JSON verarbeiten
          PROJEKT_ANZAHL=$(jq '.projekte | length' ${{ env.JSON_CONFIG }})

          for (( i=0; i<$PROJEKT_ANZAHL; i++ )); do
            PROJEKT_NAME=$(jq -r ".projekte[$i].name" ${{ env.JSON_CONFIG }})
            echo -e "\n## $PROJEKT_NAME" >> ${{ env.OUTPUT_DIR }}/index.md
            
            FILES=$(jq -r ".projekte[$i].files[]" ${{ env.JSON_CONFIG }})
            for file_path in $FILES; do
              if [ -f "$file_path" ]; then
                raw_name=$(basename "$file_path")
                cp "$file_path" "${{ env.OUTPUT_DIR }}/$raw_name"
                # Markdown Link erstellen. ?v=<Inhalts-Hash>: Dateiname bleibt bei neuem Inhalt
                # gleich (z. B. *_checker-v2.0.0.7z), neue URL umgeht Browser-/CDN-Cache (max-age=600).
                hash=$(sha256sum "$file_path" | cut -c1-10)
                echo "* [$raw_name]($raw_name?v=$hash)" >> ${{ env.OUTPUT_DIR }}/index.md
              else
                echo "* <span style='color:red'>Fehlt: $file_path</span>" >> ${{ env.OUTPUT_DIR }}/index.md
              fi
            done
          done

      - name: Versions-Anzeigen (Korrektur-Tool, Bibliothek)
        run: |
          python3 .github/scripts/version_dateien.py ${{ env.JSON_CONFIG }} ${{ env.OUTPUT_DIR }} "https://bbbaden.github.io/M346/"
          # Jekyll soll die Dateien unveraendert ausliefern (kein Layout)
          ls -l ${{ env.OUTPUT_DIR }}/version.*

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ${{ env.OUTPUT_DIR }}
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
